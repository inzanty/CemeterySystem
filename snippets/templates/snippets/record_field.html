<div class="field" data-field="{{ field.name }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">(wymagane)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="errors" role="alert" id="{{ field.auto_id }}_errors">{{ field.errors }}</div>{% endif %}
</div>
