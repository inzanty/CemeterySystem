{% if is_paginated %}
    <nav class="pagination" aria-label="Strony wyników">
        {% if page_obj.has_previous %}
            <a class="button secondary small"
               href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Poprzednia</a>
        {% endif %}
        <span>Strona {{ page_obj.number }} z {{ paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="button secondary small"
               href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Następna →</a>
        {% endif %}
    </nav>
{% endif %}
