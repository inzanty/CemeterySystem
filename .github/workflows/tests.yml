name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite3
    steps:
      - name: Configure temporary storage
        run: |
          echo "SQLITE_PATH=$RUNNER_TEMP/memoria.sqlite3" >> "$GITHUB_ENV"
          echo "MEDIA_ROOT=$RUNNER_TEMP/memoria-media" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --noinput

  javascript:
    name: Theme switcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run JavaScript tests
        run: node --test snippets/tests/*.test.cjs
